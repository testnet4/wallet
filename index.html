<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitcoin Testnet4 Taproot Wallet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#f0fdf4',
              100: '#dcfce7',
              200: '#bbf7d0',
              300: '#86efac',
              400: '#4ade80',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
              950: '#052e16',
            }
          }
        }
      }
    }
  </script>
  <script type="importmap">
    {
      "imports": {
        "@noble/curves/secp256k1": "https://esm.sh/@noble/curves@1.4.0/secp256k1",
        "@noble/hashes/sha256": "https://esm.sh/@noble/hashes@1.4.0/sha256"
      }
    }
  </script>
    <style>
    .loader {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #22c55e;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-gray-900 min-h-screen">
  <div id="app"></div>

  <script type="module">
    import { h, render, Component } from 'https://esm.sh/preact@10.19.3';
    import { useState, useEffect, useCallback } from 'https://esm.sh/preact@10.19.3/hooks';
    import htm from 'https://esm.sh/htm@3.1.1';
    import QRCode from 'https://esm.sh/qrcode@1.5.3';
    import {
      generatePrivateKey, getPublicKey, getXOnlyPubKey, getTaprootAddress,
      privateKeyToWIF, wifToPrivateKey, bytesToHex, hexToBytes, createTransaction
    } from './bitcoin.js';

    const html = htm.bind(h);

    // ===== API FUNCTIONS =====

    const API_BASE = 'https://mempool.space/testnet4/api';

    async function fetchBalance(address) {
      try {
        const response = await fetch(`${API_BASE}/address/${address}`);
        if (!response.ok) throw new Error('Failed to fetch balance');
        const data = await response.json();
        const confirmed = data.chain_stats.funded_txo_sum - data.chain_stats.spent_txo_sum;
        const unconfirmed = data.mempool_stats.funded_txo_sum - data.mempool_stats.spent_txo_sum;
        return { confirmed, unconfirmed, total: confirmed + unconfirmed };
      } catch (error) {
        console.error('Error fetching balance:', error);
        return { confirmed: 0, unconfirmed: 0, total: 0 };
      }
    }

    async function fetchTransactions(address) {
      try {
        const response = await fetch(`${API_BASE}/address/${address}/txs`);
        if (!response.ok) throw new Error('Failed to fetch transactions');
        return await response.json();
      } catch (error) {
        console.error('Error fetching transactions:', error);
        return [];
      }
    }

    async function fetchUTXOs(address) {
      try {
        const response = await fetch(`${API_BASE}/address/${address}/utxo`);
        if (!response.ok) throw new Error('Failed to fetch UTXOs');
        return await response.json();
      } catch (error) {
        console.error('Error fetching UTXOs:', error);
        return [];
      }
    }

    async function fetchFeeRates() {
      try {
        const response = await fetch(`${API_BASE}/v1/fees/recommended`);
        if (!response.ok) throw new Error('Failed to fetch fee rates');
        return await response.json();
      } catch (error) {
        console.error('Error fetching fee rates:', error);
        return { fastestFee: 10, halfHourFee: 5, hourFee: 2, minimumFee: 1 };
      }
    }

    async function broadcastTransaction(txHex) {
      try {
        const response = await fetch(`${API_BASE}/tx`, {
          method: 'POST',
          body: txHex
        });
        if (!response.ok) {
          const error = await response.text();
          throw new Error(error);
        }
        return await response.text();
      } catch (error) {
        throw error;
      }
    }

    // ===== WALLET STORAGE =====

    function saveWallet(wallet) {
      localStorage.setItem('testnet4_wallet', JSON.stringify(wallet));
    }

    function loadWallet() {
      const data = localStorage.getItem('testnet4_wallet');
      return data ? JSON.parse(data) : null;
    }

    function clearWallet() {
      localStorage.removeItem('testnet4_wallet');
    }

    // ===== REACT COMPONENTS =====

    function App() {
      const [wallet, setWallet] = useState(null);
      const [view, setView] = useState('home');
      const [balance, setBalance] = useState({ confirmed: 0, unconfirmed: 0, total: 0 });
      const [transactions, setTransactions] = useState([]);
      const [loading, setLoading] = useState(false);
      const [notification, setNotification] = useState(null);
      const [showSchemeInfo, setShowSchemeInfo] = useState(false);

      useEffect(() => {
        const savedWallet = loadWallet();
        if (savedWallet) {
          setWallet(savedWallet);
        }
      }, []);

      useEffect(() => {
        if (wallet) {
          refreshData();
          // One-time notice: the address scheme changed to untweaked (npub-aligned)
          if (!localStorage.getItem('testnet4_scheme_notice_v1')) {
            setShowSchemeInfo(true);
          }
        }
      }, [wallet]);

      const closeSchemeInfo = () => {
        localStorage.setItem('testnet4_scheme_notice_v1', '1');
        setShowSchemeInfo(false);
      };

      const showNotification = (message, type = 'info') => {
        setNotification({ message, type });
        setTimeout(() => setNotification(null), 5000);
      };

      const refreshData = async () => {
        if (!wallet) return;
        setLoading(true);
        try {
          const [bal, txs] = await Promise.all([
            fetchBalance(wallet.address),
            fetchTransactions(wallet.address)
          ]);
          setBalance(bal);
          setTransactions(txs);
        } catch (error) {
          showNotification('Error refreshing data', 'error');
        }
        setLoading(false);
      };

      const createNewWallet = () => {
        const privateKey = generatePrivateKey();
        const publicKey = getPublicKey(privateKey);
        const xOnlyPubKey = getXOnlyPubKey(privateKey);
        const address = getTaprootAddress(privateKey);
        const wif = privateKeyToWIF(privateKey);

        const newWallet = {
          privateKey: bytesToHex(privateKey),
          publicKey: bytesToHex(publicKey),
          xOnlyPubKey: bytesToHex(xOnlyPubKey),
          address,
          wif
        };

        setWallet(newWallet);
        saveWallet(newWallet);
        showNotification('New Taproot wallet created!', 'success');
        setView('home');
      };

      const importWallet = (input) => {
        try {
          const trimmed = input.trim();
          let privateKey;

          // Check if it's a 64-char hex string (32 bytes)
          if (/^[0-9a-fA-F]{64}$/.test(trimmed)) {
            privateKey = hexToBytes(trimmed);
          } else {
            // Try WIF format
            privateKey = wifToPrivateKey(trimmed);
          }

          const publicKey = getPublicKey(privateKey);
          const xOnlyPubKey = getXOnlyPubKey(privateKey);
          const address = getTaprootAddress(privateKey);
          const wif = privateKeyToWIF(privateKey);

          const newWallet = {
            privateKey: bytesToHex(privateKey),
            publicKey: bytesToHex(publicKey),
            xOnlyPubKey: bytesToHex(xOnlyPubKey),
            address,
            wif
          };

          setWallet(newWallet);
          saveWallet(newWallet);
          showNotification('Wallet imported successfully!', 'success');
          setView('home');
        } catch (error) {
          showNotification('Invalid private key (use 64-char hex or WIF)', 'error');
        }
      };

      const logout = () => {
        clearWallet();
        setWallet(null);
        setBalance({ confirmed: 0, unconfirmed: 0, total: 0 });
        setTransactions([]);
        setView('home');
        showNotification('Wallet disconnected', 'info');
      };

      const formatSats = (sats) => {
        return (sats / 100000000).toFixed(8);
      };

      const formatDate = (timestamp) => {
        if (!timestamp) return 'Pending';
        return new Date(timestamp * 1000).toLocaleString();
      };

      const truncateHash = (hash, chars = 8) => {
        return `${hash.slice(0, chars)}...${hash.slice(-chars)}`;
      };

      return html`
        <div class="min-h-screen bg-gradient-to-b from-gray-900 to-gray-800">
          ${notification && html`
            <div class="fixed top-4 right-4 z-50 px-6 py-3 rounded-lg shadow-lg ${
              notification.type === 'success' ? 'bg-primary-600' :
              notification.type === 'error' ? 'bg-red-600' : 'bg-gray-700'
            } text-white font-medium animate-pulse">
              ${notification.message}
            </div>
          `}

          ${showSchemeInfo && html`
            <${AddressSchemeModal} onClose=${closeSchemeInfo} />
          `}

          <${Header} wallet=${wallet} onLogout=${logout} onRefresh=${refreshData} loading=${loading} />

          <main class="container mx-auto px-4 py-8 max-w-4xl">
            ${!wallet ? html`
              <${WelcomeScreen} onCreateWallet=${createNewWallet} onImportWallet=${importWallet} />
            ` : html`
              <${Navigation} view=${view} setView=${setView} />

              ${view === 'home' && html`
                <${Dashboard}
                  wallet=${wallet}
                  balance=${balance}
                  transactions=${transactions}
                  formatSats=${formatSats}
                  formatDate=${formatDate}
                  truncateHash=${truncateHash}
                  onRefresh=${refreshData}
                  loading=${loading}
                  onShowInfo=${() => setShowSchemeInfo(true)}
                />
              `}

              ${view === 'send' && html`
                <${SendView}
                  wallet=${wallet}
                  balance=${balance}
                  formatSats=${formatSats}
                  showNotification=${showNotification}
                  onRefresh=${refreshData}
                />
              `}

              ${view === 'receive' && html`
                <${ReceiveView} wallet=${wallet} onShowInfo=${() => setShowSchemeInfo(true)} />
              `}

              ${view === 'history' && html`
                <${HistoryView}
                  wallet=${wallet}
                  transactions=${transactions}
                  formatSats=${formatSats}
                  formatDate=${formatDate}
                  truncateHash=${truncateHash}
                />
              `}

              ${view === 'settings' && html`
                <${SettingsView} wallet=${wallet} onLogout=${logout} />
              `}
            `}
          </main>

          <${Footer} />
        </div>
      `;
    }

    function AddressSchemeModal({ onClose }) {
      return html`
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70" onClick=${onClose}>
          <div class="bg-gray-800 border border-gray-700 rounded-2xl p-6 max-w-md w-full shadow-2xl" onClick=${(e) => e.stopPropagation()}>
            <div class="flex items-center gap-3 mb-4">
              <div class="w-10 h-10 bg-primary-600 rounded-full flex items-center justify-center flex-shrink-0">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
              </div>
              <h3 class="text-xl font-semibold text-white">How your address works</h3>
            </div>

            <div class="space-y-3 text-sm text-gray-300">
              <p>
                Your Taproot address is the${' '}<strong class="text-white">bech32m encoding of your x-only public key</strong>${' '}—
                the exact same key as your Nostr${' '}<code class="text-primary-400">npub</code>.
                One keypair, one identity, on both networks: the data part of
                your${' '}<code class="text-primary-400">npub</code>${' '}and
                your${' '}<code class="text-primary-400">tb1p…</code>${' '}address are identical.
              </p>
              <p>
                This means the wallet skips the BIP341 key tweak that most Bitcoin wallets apply.
                The address is fully valid and spendable on-chain, but if you import the same
                private key into a standard wallet (e.g. Bitcoin Core), it will derive
                a${' '}<em>different</em>${' '}(tweaked) address.
              </p>
              <div class="bg-yellow-900/30 border border-yellow-700/50 rounded-lg p-3">
                <p class="text-yellow-400 text-xs">
                  <strong>Upgrading?</strong> Earlier versions of this wallet used tweaked addresses,
                  so your address has changed. Coins sent to the old address are not shown here.
                </p>
              </div>
            </div>

            <button
              onClick=${onClose}
              class="mt-6 w-full py-3 bg-primary-600 hover:bg-primary-700 text-white font-semibold rounded-lg transition-colors"
            >
              Got it
            </button>
          </div>
        </div>
      `;
    }

    function Header({ wallet, onLogout, onRefresh, loading }) {
      return html`
        <header class="bg-gray-800/50 backdrop-blur-sm border-b border-gray-700 sticky top-0 z-40">
          <div class="container mx-auto px-4 py-4 max-w-4xl">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-primary-600 rounded-full flex items-center justify-center">
                  <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                  </svg>
                </div>
                <div>
                  <h1 class="text-xl font-bold text-white">Taproot Wallet</h1>
                  <p class="text-xs text-primary-400">Bitcoin Testnet4</p>
                </div>
              </div>
              ${wallet && html`
                <div class="flex items-center gap-2">
                  <button
                    onClick=${onRefresh}
                    disabled=${loading}
                    class="p-2 text-gray-400 hover:text-primary-400 transition-colors disabled:opacity-50"
                    title="Refresh"
                  >
                    ${loading ? html`<div class="loader"></div>` : html`
                      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                      </svg>
                    `}
                  </button>
                </div>
              `}
            </div>
          </div>
        </header>
      `;
    }

    function Navigation({ view, setView }) {
      const tabs = [
        { id: 'home', label: 'Home', icon: 'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6' },
        { id: 'send', label: 'Send', icon: 'M12 19l9 2-9-18-9 18 9-2zm0 0v-8' },
        { id: 'receive', label: 'Receive', icon: 'M12 4v16m8-8H4' },
        { id: 'history', label: 'History', icon: 'M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z' },
        { id: 'settings', label: 'Settings', icon: 'M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z M15 12a3 3 0 11-6 0 3 3 0 016 0z' }
      ];

      return html`
        <nav class="flex justify-center mb-8">
          <div class="bg-gray-800 rounded-xl p-1 flex gap-1">
            ${tabs.map(tab => html`
              <button
                key=${tab.id}
                onClick=${() => setView(tab.id)}
                class="flex items-center gap-2 px-4 py-2 rounded-lg transition-all ${
                  view === tab.id
                    ? 'bg-primary-600 text-white'
                    : 'text-gray-400 hover:text-white hover:bg-gray-700'
                }"
              >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d=${tab.icon} />
                </svg>
                <span class="hidden sm:inline">${tab.label}</span>
              </button>
            `)}
          </div>
        </nav>
      `;
    }

    function WelcomeScreen({ onCreateWallet, onImportWallet }) {
      const [showImport, setShowImport] = useState(false);
      const [wifInput, setWifInput] = useState('');

      return html`
        <div class="flex flex-col items-center justify-center min-h-[60vh]">
          <div class="text-center mb-12">
            <div class="w-24 h-24 bg-primary-600 rounded-full flex items-center justify-center mx-auto mb-6">
              <svg class="w-14 h-14 text-white" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
              </svg>
            </div>
            <h2 class="text-3xl font-bold text-white mb-3">Bitcoin Testnet4 Taproot Wallet</h2>
            <p class="text-gray-400 max-w-md">
              A secure, client-side Bitcoin wallet for Testnet4. Your keys never leave your browser.
            </p>
          </div>

          ${!showImport ? html`
            <div class="flex flex-col sm:flex-row gap-4">
              <button
                onClick=${onCreateWallet}
                class="px-8 py-4 bg-primary-600 hover:bg-primary-700 text-white font-semibold rounded-xl transition-colors flex items-center gap-3"
              >
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                </svg>
                Create New Wallet
              </button>
              <button
                onClick=${() => setShowImport(true)}
                class="px-8 py-4 bg-gray-700 hover:bg-gray-600 text-white font-semibold rounded-xl transition-colors flex items-center gap-3"
              >
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                </svg>
                Import Wallet
              </button>
            </div>
          ` : html`
            <div class="w-full max-w-md bg-gray-800 rounded-xl p-6">
              <h3 class="text-lg font-semibold text-white mb-4">Import Wallet</h3>
              <div class="space-y-4">
                <div>
                  <label class="block text-sm text-gray-400 mb-2">Private Key (Hex or WIF)</label>
                  <input
                    type="password"
                    value=${wifInput}
                    onInput=${(e) => setWifInput(e.target.value)}
                    placeholder="64-char hex (Nostr nsec) or WIF..."
                    class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-primary-500"
                  />
                  <p class="text-gray-500 text-xs mt-1">Supports 64-char hex (same as Nostr) or WIF format</p>
                </div>
                <div class="flex gap-3">
                  <button
                    onClick=${() => onImportWallet(wifInput)}
                    disabled=${!wifInput}
                    class="flex-1 py-3 bg-primary-600 hover:bg-primary-700 disabled:bg-gray-600 disabled:cursor-not-allowed text-white font-semibold rounded-lg transition-colors"
                  >
                    Import
                  </button>
                  <button
                    onClick=${() => { setShowImport(false); setWifInput(''); }}
                    class="px-6 py-3 bg-gray-700 hover:bg-gray-600 text-white font-semibold rounded-lg transition-colors"
                  >
                    Cancel
                  </button>
                </div>
              </div>
            </div>
          `}

          <div class="mt-12 p-4 bg-yellow-900/30 border border-yellow-700/50 rounded-lg max-w-md">
            <p class="text-yellow-400 text-sm text-center">
              <strong>Testnet4 Only:</strong> This wallet is for Bitcoin Testnet4. Coins have no real value.
            </p>
          </div>
        </div>
      `;
    }

    function Dashboard({ wallet, balance, transactions, formatSats, formatDate, truncateHash, onRefresh, loading, onShowInfo }) {
      return html`
        <div class="space-y-6">
          <!-- Balance Card -->
          <div class="bg-gradient-to-br from-primary-900 to-primary-800 rounded-2xl p-6 shadow-xl">
            <div class="text-center">
              <p class="text-primary-200 text-sm mb-1">Total Balance</p>
              <h2 class="text-4xl font-bold text-white mb-2">${formatSats(balance.total)} BTC</h2>
              <p class="text-primary-300 text-sm">${balance.total.toLocaleString()} sats</p>
            </div>
            <div class="grid grid-cols-2 gap-4 mt-6 pt-6 border-t border-primary-700">
              <div class="text-center">
                <p class="text-primary-300 text-xs">Confirmed</p>
                <p class="text-white font-medium">${formatSats(balance.confirmed)} BTC</p>
              </div>
              <div class="text-center">
                <p class="text-primary-300 text-xs">Pending</p>
                <p class="text-white font-medium">${formatSats(balance.unconfirmed)} BTC</p>
              </div>
            </div>
          </div>

          <!-- Address Card -->
          <div class="bg-gray-800 rounded-xl p-4">
            <div class="flex items-center justify-between mb-2">
              <p class="text-gray-400 text-xs">Your Taproot Address</p>
              <button
                onClick=${onShowInfo}
                class="text-gray-500 hover:text-primary-400 transition-colors"
                title="How is this address derived?"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
              </button>
            </div>
            <div class="flex items-center gap-2">
              <code class="flex-1 text-primary-400 text-sm bg-gray-900 px-3 py-2 rounded-lg overflow-hidden text-ellipsis">
                ${wallet.address}
              </code>
              <button
                onClick=${() => { navigator.clipboard.writeText(wallet.address); }}
                class="p-2 bg-gray-700 hover:bg-gray-600 rounded-lg transition-colors"
                title="Copy address"
              >

    function SendView({ wallet, balance, formatSats, showNotification, onRefresh }) {
      const [recipient, setRecipient] = useState('');
      const [amount, setAmount] = useState('');
      const [feeRate, setFeeRate] = useState(5);
      const [feeRates, setFeeRates] = useState(null);
      const [sending, setSending] = useState(false);
      const [txResult, setTxResult] = useState(null);

      useEffect(() => {
        fetchFeeRates().then(setFeeRates);
      }, []);

      const handleSend = async () => {
        if (!recipient || !amount) {
          showNotification('Please fill in all fields', 'error');
          return;
        }

        const satsAmount = Math.floor(parseFloat(amount) * 100000000);
        if (satsAmount <= 0 || satsAmount > balance.total) {
          showNotification('Invalid amount', 'error');
          return;
        }

        setSending(true);
        try {
          const utxos = await fetchUTXOs(wallet.address);
          if (utxos.length === 0) {
            throw new Error('No UTXOs available');
          }

          const privateKey = hexToBytes(wallet.privateKey);
          const tx = await createTransaction(privateKey, utxos, recipient, satsAmount, feeRate);

          const txid = await broadcastTransaction(tx.hex);
          setTxResult({ txid, amount: satsAmount, fee: tx.fee });
          showNotification('Transaction sent successfully!', 'success');
          setRecipient('');
          setAmount('');
          onRefresh();
        } catch (error) {
          console.error('Send error:', error);
          showNotification(`Error: ${error.message}`, 'error');
        }
        setSending(false);
      };

      const setMaxAmount = () => {
        // Leave some for fee
        const maxSats = balance.total - (feeRate * 200);
        if (maxSats > 0) {
          setAmount((maxSats / 100000000).toFixed(8));
        }
      };

      return html`
        <div class="max-w-lg mx-auto">
          <div class="bg-gray-800 rounded-xl p-6">
            <h3 class="text-xl font-semibold text-white mb-6">Send Bitcoin</h3>

            ${txResult ? html`
              <div class="bg-primary-900/50 border border-primary-700 rounded-lg p-6 text-center">
                <svg class="w-16 h-16 text-primary-400 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <h4 class="text-lg font-semibold text-white mb-2">Transaction Sent!</h4>
                <p class="text-gray-400 mb-4">${formatSats(txResult.amount)} BTC sent</p>
                <p class="text-gray-500 text-sm mb-4">Fee: ${txResult.fee} sats</p>
                <a
                  href="https://mempool.space/testnet4/tx/${txResult.txid}"
                  target="_blank"
                  class="text-primary-400 hover:text-primary-300 text-sm break-all"
                >
                  ${txResult.txid}
                </a>
                <button
                  onClick=${() => setTxResult(null)}
                  class="mt-6 w-full py-3 bg-gray-700 hover:bg-gray-600 text-white rounded-lg transition-colors"
                >
                  Send Another
                </button>
              </div>
            ` : html`
              <div class="space-y-5">
                <div>
                  <label class="block text-sm text-gray-400 mb-2">Recipient Address</label>
                  <input
                    type="text"
                    value=${recipient}
                    onInput=${(e) => setRecipient(e.target.value)}
                    placeholder="tb1p... or tb1q..."
                    class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-primary-500"
                  />
                </div>

                <div>
                  <label class="block text-sm text-gray-400 mb-2">Amount (BTC)</label>
                  <div class="relative">
                    <input
                      type="number"
                      step="0.00000001"
                      value=${amount}
                      onInput=${(e) => setAmount(e.target.value)}
                      placeholder="0.00000000"
                      class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-primary-500 pr-20"
                    />
                    <button
                      onClick=${setMaxAmount}
                      class="absolute right-2 top-1/2 -translate-y-1/2 px-3 py-1 bg-primary-600 hover:bg-primary-700 text-white text-sm rounded transition-colors"
                    >
                      MAX
                    </button>
                  </div>
                  <p class="text-gray-500 text-xs mt-1">
                    Available: ${formatSats(balance.total)} BTC
                  </p>
                </div>

                <div>
                  <label class="block text-sm text-gray-400 mb-2">Fee Rate (sat/vB)</label>
                  <div class="grid grid-cols-3 gap-2 mb-2">
                    ${feeRates && html`
                      <button
                        onClick=${() => setFeeRate(feeRates.hourFee)}
                        class="py-2 px-3 rounded-lg text-sm ${feeRate === feeRates.hourFee ? 'bg-primary-600 text-white' : 'bg-gray-700 text-gray-300 hover:bg-gray-600'}"
                      >
                        Slow (${feeRates.hourFee})
                      </button>
                      <button
                        onClick=${() => setFeeRate(feeRates.halfHourFee)}
                        class="py-2 px-3 rounded-lg text-sm ${feeRate === feeRates.halfHourFee ? 'bg-primary-600 text-white' : 'bg-gray-700 text-gray-300 hover:bg-gray-600'}"
                      >
                        Normal (${feeRates.halfHourFee})
                      </button>
                      <button
                        onClick=${() => setFeeRate(feeRates.fastestFee)}
                        class="py-2 px-3 rounded-lg text-sm ${feeRate === feeRates.fastestFee ? 'bg-primary-600 text-white' : 'bg-gray-700 text-gray-300 hover:bg-gray-600'}"
                      >

                      </button>
                    `}
                  </div>
                  <input
                    type="range"

                    onInput=${(e) => setFeeRate(parseInt(e.target.value))}
                    class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-primary-500"
                  />
                  <p class="text-gray-500 text-xs mt-1">Current: ${feeRate} sat/vB</p>
                </div>

                <button

                  ` : html`
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                    <span>Send Bitcoin</span>
                  `}
                </button>
              </div>
            `}
          </div>
        </div>
      `;
    }
